# Integration verification only. Never use these outputs as research evidence.
protocol: burgers-fixture-v1
fixture: true
data:
  seed: 123
  counts: {train: 4, validation: 2, test: 2}
  reference_n: 128
  resolutions: [32, 64, 128]
  base_n: 32
  viscosity: 0.01
  dt: 0.01
  final_time: 0.04
  train_time: 0.02
  ic_modes: 8
  ic_rms: 0.5
  mean_range: [-0.5, 0.5]
  shard_size: 2
solver:
  initial_dt: 0.001
  convergence_tolerance: 0.0001
  mass_tolerance: 0.0000000001
  energy_tolerance: 0.0000000001
  max_refinements: 8
  verification_seeds: [10101]
model:
  fno: {width: 8, modes: 8, layers: 4, projection: 16}
  unet: {channels: [4, 8, 16, 32]}
training:
  seeds: [0, 1]
  weights: [1.0]
  derivatives: [spectral, finite_difference]
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  lr_step: 1
  lr_gamma: 0.5
  validation_every: 1
  checkpoint_every_updates: 1
evaluation:
  horizons: [2, 4]
  denominator_floor: 0.00000001
  divergence_factor: 100.0
  bootstrap_samples: 100
  bootstrap_seed: 456
runtime:
  device: cpu
  microbatch: 2
  evaluation_batch: 2
  disk_safety_margin_gb: 0.01
