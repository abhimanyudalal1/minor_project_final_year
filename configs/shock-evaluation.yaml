evaluation:
  horizons:
  - 100
  - 200
  denominator_floor: 1.0e-08
  divergence_factor: 100.0
  bootstrap_samples: 10000
  bootstrap_seed: 20261115
  comparisons:
  - - physics-soft
    - fno
  - - physics-constrained
    - fno
  - - physics-constrained
    - physics-soft
runtime:
  device: auto
  microbatch: 32
  evaluation_batch: 16
  disk_safety_margin_gb: 5
