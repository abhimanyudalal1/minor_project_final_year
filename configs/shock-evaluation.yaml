# Evaluation-only physical parameter shift; independent solver verification required.
protocol: burgers-shock-evaluation-v2
fixture: false
data:
  seed: 20261116
  counts:
    train: 0
    validation: 0
    test: 300
  reference_n: 8192
  resolutions:
  - 256
  - 512
  - 1024
  base_n: 256
  viscosity: 0.001
  dt: 0.01
  final_time: 2.0
  train_time: 1.0
  ic_modes: 64
  ic_rms: 0.5
  mean_range:
  - -0.5
  - 0.5
  shard_size: 16
solver:
  initial_dt: 0.00025
  convergence_tolerance: 1.0e-05
  mass_tolerance: 1.0e-10
  energy_tolerance: 1.0e-10
  max_refinements: 8
  verification_seeds:
  - 10101
  - 20202
  - 30303
  - 40404
model:
