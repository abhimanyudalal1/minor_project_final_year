    width: 71
    modes: 16
    layers: 4
    projection: 77
  unet:
    channels:
    - 32
    - 64
    - 128
    - 256
training:
  seeds:
  - 0
  - 1
  - 2
  epochs: 60
  batch_size: 256
  learning_rate: 0.0003
  validation_every: 2
  checkpoint_every_updates: 100
  scheduler: cosine
  eta_min: 3.0e-06
  variants:
  - name: unet
    model: unet
    weight: 0.0
  - name: fno
    model: fno
    weight: 0.0
  - name: physics-soft
    model: fno
    weight: 1.0
    derivative: spectral
    physics_steps: 1
