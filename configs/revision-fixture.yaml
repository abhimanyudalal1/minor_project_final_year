# Software integration only; not research evidence.
protocol: burgers-revision-fixture-v2
fixture: true
data:
  seed: 123
  counts:
    train: 4
    validation: 2
    test: 2
  reference_n: 128
  resolutions:
  - 32
  - 64
  - 128
  base_n: 32
  viscosity: 0.01
  dt: 0.01
  final_time: 0.04
  train_time: 0.02
  ic_modes: 8
  ic_rms: 0.5
  mean_range:
  - -0.5
  - 0.5
  shard_size: 2
solver:
  initial_dt: 0.001
  convergence_tolerance: 0.0001
  mass_tolerance: 1.0e-10
  energy_tolerance: 1.0e-10
  max_refinements: 8
  verification_seeds:
  - 10101
model:
  fno:
    width: 8
    modes: 8
    layers: 4
    projection: 16
  unet:
    channels:
    - 4
    - 8
    - 16
    - 32
training:
  seeds:
  - 0
  - 1
  - 2
  epochs: 3
  batch_size: 4
  learning_rate: 0.0003
  validation_every: 1
  checkpoint_every_updates: 1
  scheduler: cosine
  eta_min: 3.0e-06
  variants:
  - name: unet
    model: unet
    weight: 0.0
  - name: fno
    model: fno
    weight: 0.0
  - name: physics-soft
    model: fno
    weight: 1.0
    derivative: spectral
    physics_steps: 1
  - name: physics-constrained
    model: fno
    weight: 1.0
    derivative: spectral
    stepping: residual
    conserve_mean: true
    physics_steps: 2
evaluation:
  horizons:
  - 2
  - 4
  denominator_floor: 1.0e-08
  divergence_factor: 100.0
  bootstrap_samples: 100
  bootstrap_seed: 456
  comparisons:
  - - physics-soft
    - fno
  - - physics-constrained
    - fno
  - - physics-constrained
    - physics-soft
runtime:
  device: cpu
  microbatch: 2
  evaluation_batch: 2
  disk_safety_margin_gb: 0.01
