[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "burgers-research"
version = "0.1.0"
description = "Reproducible controlled experiments on physics-constrained Burgers neural operators"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "torch>=2.6", "h5py>=3.12", "PyYAML>=6", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
burgers = "burgers_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
